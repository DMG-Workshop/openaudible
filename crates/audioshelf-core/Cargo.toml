[package]
name = "audioshelf-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Library scanning, metadata probing and FFmpeg conversion for AudioShelf. No UI dependencies."

[dependencies]
anyhow = "1"
futures-util = "0.3"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
