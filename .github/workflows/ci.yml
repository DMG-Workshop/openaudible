name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Stage local FFmpeg for tests (CI only, never shipped)
        run: node scripts/fetch-ffmpeg.mjs --local
      - name: Rust tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Frontend typecheck, tests and build
        run: |
          npm run typecheck
          npx vitest run
          npm run build

  # Unsigned Windows test build. Not a release: it stages a GPL FFmpeg from
  # Chocolatey, which must never be redistributed. Release builds use the pinned LGPL manifest.
  windows-test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install test-only FFmpeg
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - name: Stage local FFmpeg sidecars (test build only)
        run: node scripts/fetch-ffmpeg.mjs --local
      - name: Build NSIS and MSI installers
        run: npx tauri build --bundles nsis,msi
      - name: Upload unsigned test installers
        uses: actions/upload-artifact@v4
        with:
          name: audioshelf-windows-test-unsigned
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          retention-days: 7
          if-no-files-found: error
